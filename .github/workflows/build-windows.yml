name: Build Windows (ObsidianRECORDER Desktop)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests Rust (cargo test)
    runs-on: windows-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # Zéro régression (méthode Gauntlet Loop) : le job de build ne se
      # déclenche que si toute la suite de tests passe à 100 %.
      - name: Exécution des tests unitaires et d'intégration
        working-directory: src-tauri
        run: cargo test --all --verbose

  build:
    name: Build de l'exécutable Windows
    needs: test
    runs-on: windows-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # `npm install` (et non `npm ci`) tant qu'aucun package-lock.json n'a
      # encore été committé — voir le README, section « Limites connues ».
      - name: Installation des dépendances front-end
        run: npm install

      - name: Installation de Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      # `beforeBuildCommand` (npm run build) est exécuté automatiquement par
      # `cargo tauri build`, depuis la racine du projet (à côté de package.json).
      - name: Build de l'application (installeur NSIS + binaire)
        run: cargo tauri build

      - name: Publication de l'installateur NSIS
        uses: actions/upload-artifact@v4
        with:
          name: ObsidianRECORDER-Desktop-installateur-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publication du binaire portable
        uses: actions/upload-artifact@v4
        with:
          name: ObsidianRECORDER-Desktop-portable
          path: src-tauri/target/release/obsidianrecorder-desktop.exe
          if-no-files-found: error
